<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="100" fill="url(#gradBg)"/>
  
  <!-- Hanging Display Card Board -->
  <g filter="url(#shadow)">
    <rect x="116" y="80" width="280" height="350" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="6"/>
    <!-- Card Hanging Hole at Top -->
    <circle cx="256" cy="115" r="16" fill="#ea580c" stroke="#991b1b" stroke-width="4"/>
    <!-- Card Header Tag -->
    <rect x="146" y="145" width="220" height="36" rx="8" fill="#b45309"/>
    <text x="256" y="169" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">SPICE PACKS</text>
    
    <!-- 4 Mini Spice Sachets attached to card -->
    <!-- Sachet 1 (Chilli - Red) -->
    <rect x="146" y="195" width="95" height="95" rx="8" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
    <rect x="156" y="205" width="75" height="12" rx="3" fill="#fee2e2"/>
    <circle cx="193" cy="250" r="18" fill="#f87171"/>
    
    <!-- Sachet 2 (Turmeric - Yellow) -->
    <rect x="271" y="195" width="95" height="95" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <rect x="281" y="205" width="75" height="12" rx="3" fill="#fef3c7"/>
    <circle cx="318" cy="250" r="18" fill="#fbbf24"/>
    
    <!-- Sachet 3 (Pepper - Dark) -->
    <rect x="146" y="305" width="95" height="95" rx="8" fill="#374151" stroke="#111827" stroke-width="3"/>
    <rect x="156" y="315" width="75" height="12" rx="3" fill="#e5e7eb"/>
    <circle cx="193" cy="360" r="18" fill="#4b5563"/>
    
    <!-- Sachet 4 (Curry Powder - Orange) -->
    <rect x="271" y="305" width="95" height="95" rx="8" fill="#d97706" stroke="#92400e" stroke-width="3"/>
    <rect x="281" y="315" width="75" height="12" rx="3" fill="#fef3c7"/>
    <circle cx="318" cy="360" r="18" fill="#f59e0b"/>
  </g>
  
  <!-- POS Receipt / Badge overlay in bottom right -->
  <g filter="url(#shadow)">
    <circle cx="390" cy="390" r="64" fill="url(#gradGold)" stroke="#ffffff" stroke-width="6"/>
    <text x="390" y="380" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#78350f" text-anchor="middle">SPICE</text>
    <text x="390" y="408" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#78350f" text-anchor="middle">POS</text>
  </g>
</svg>
